<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantPulse — Market &amp; ETF Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Sticky Top Navigation Bar -->
  <header id="main-header" class="top-header">
    <div class="header-inner">
      <!-- Brand -->
      <div class="brand-group">
        <div class="brand-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title-row">
            <h1 class="brand-title">QuantPulse</h1>
            <span id="status-badge" class="status-badge font-mono">
              <span id="status-dot" class="status-dot"></span>
              <span id="status-label">Market Terminal</span>
            </span>
          </div>
          <p class="brand-subtitle">Macro ETFs &amp; Equities Quantitative Dashboard</p>
        </div>
      </div>

      <!-- Right Action Controls -->
      <div class="header-actions">
        <!-- View Mode Switcher -->
        <div class="segmented-group desktop-only-seg">
          <button type="button" data-view="split" onclick="TerminalUI.setViewMode('split')" class="view-btn seg-btn active">
            Both Sheets
          </button>
          <button type="button" data-view="etfs" onclick="TerminalUI.setViewMode('etfs')" class="view-btn seg-btn">
            ETFs Only
          </button>
          <button type="button" data-view="stocks" onclick="TerminalUI.setViewMode('stocks')" class="view-btn seg-btn">
            Stocks Only
          </button>
        </div>

        <!-- Quick Finviz Chart Lookup -->
        <form onsubmit="TerminalUI.openFinvizLookup(event)" class="search-form-desktop">
          <input id="finviz-ticker-input" type="text" maxlength="10" placeholder="Ticker (e.g. SPY)" class="search-input font-mono" />
          <button type="submit" class="search-submit-btn">Finviz ↗</button>
        </form>

        <!-- Refresh Data & Charts Button -->
        <button id="reload-btn" onclick="TerminalUI.refreshAll()" title="Reload Both Google Sheets & Finviz Charts" class="btn-primary">
          <svg id="reload-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="main-workspace">

    <!-- Top Quick Finviz Launcher Bar -->
    <section class="panel-card">
      <div class="launcher-top">
        <div class="launcher-title-wrap">
          <span class="launcher-title">Quick Chart Launcher</span>
          <span class="launcher-hint">• Click any ticker to open Finviz daily chart</span>
        </div>

        <!-- Mobile Finviz Search -->
        <form onsubmit="TerminalUI.openFinvizLookup(event)" class="search-form-mobile">
          <input id="finviz-ticker-mobile" type="text" maxlength="10" placeholder="Finviz Ticker..." class="search-input font-mono" />
          <button type="submit" class="search-submit-btn">Chart ↗</button>
        </form>

        <!-- Section Jump Links -->
        <div class="jump-links">
          <a href="#etfs-section">1. Macro ETFs ↓</a>
          <span>|</span>
          <a href="#stocks-section">2. Stocks &amp; Leaders ↓</a>
        </div>
      </div>

      <!-- Horizontally Scrollable Macro & Sector ETF Chips -->
      <div class="chips-row">
        <span class="chips-label">Finviz Charts:</span>
        <div id="quick-tickers-bar" class="chips-list"></div>
      </div>
    </section>

    <!-- Collapsible Side-Scrollable Finviz Daily Chart Gallery -->
    <section id="chart-gallery-panel" class="panel-card">
      <div class="gallery-header" id="gallery-header-bar">
        <button type="button" id="gallery-toggle-btn" onclick="TerminalUI.toggleGallery()" aria-expanded="true" class="gallery-toggle-trigger">
          <span class="dot-indigo"></span>
          <h2 class="gallery-title">Daily Market &amp; Sector Pulse (Finviz)</h2>
          <span class="gallery-sub font-mono">• SPY, QQQ, DIA, MDY, SMH &amp; S&amp;P 500 Sectors</span>
          <span id="gallery-collapse-badge" class="collapse-badge font-mono">
            <svg id="gallery-chevron" width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
            <span id="gallery-toggle-label">Hide</span>
          </span>
        </button>

        <div id="gallery-nav-controls" class="gallery-nav">
          <button type="button" onclick="TerminalUI.scrollGallery(-1)" aria-label="Scroll charts left" class="icon-btn">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
          </button>
          <button type="button" onclick="TerminalUI.scrollGallery(1)" aria-label="Scroll charts right" class="icon-btn">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>
      </div>

      <div id="gallery-collapsible-body" class="gallery-body">
        <div id="finviz-chart-gallery" class="gallery-track"></div>
      </div>
    </section>

    <!-- Sheet Viewport Controls (Tab Switcher + Zoom Density) -->
    <section class="panel-card controls-bar">
      <!-- Tab / Layout Mode Selector -->
      <div class="segmented-group">
        <button type="button" data-view="split" onclick="TerminalUI.setViewMode('split')" class="view-btn seg-btn active">
          Both Sheets
        </button>
        <button type="button" data-view="etfs" onclick="TerminalUI.setViewMode('etfs')" class="view-btn seg-btn">
          1. ETFs
        </button>
        <button type="button" data-view="stocks" onclick="TerminalUI.setViewMode('stocks')" class="view-btn seg-btn">
          2. Stocks
        </button>
      </div>

      <!-- Zoom & Sync Controls -->
      <div class="scale-group">
        <div class="segmented-group">
          <span class="scale-label">Scale:</span>
          <button type="button" data-scale="0.72" onclick="TerminalUI.setScale(0.72)" class="scale-btn font-mono">
            72%
          </button>
          <button type="button" data-scale="0.85" onclick="TerminalUI.setScale(0.85)" class="scale-btn font-mono">
            85%
          </button>
          <button type="button" data-scale="1" onclick="TerminalUI.setScale(1)" class="scale-btn font-mono active">
            100%
          </button>
        </div>

        <span id="last-updated-text" class="sync-timestamp font-mono">2 Live Feeds</span>
      </div>
    </section>

    <!-- DUAL IFRAME DATA WORKSPACE -->
    <div id="iframes-grid" class="iframes-grid split-active">

      <!-- SECTION 1: ETFs IFRAME -->
      <section id="etfs-section" class="sheet-card">
        <div class="sheet-card-header">
          <div class="sheet-title-wrap">
            <span class="pulse-dot-indigo"></span>
            <h2 class="sheet-title">1. Macro &amp; Sector ETFs</h2>
            <span class="pill-indigo font-mono">Live Sheet</span>
          </div>
          <div>
            <button type="button" onclick="TerminalUI.reloadSingleFrame('etfs')" class="btn-secondary">
              Reload ETFs
            </button>
          </div>
        </div>

        <div id="etfs-frame-wrap" class="sheet-frame-wrap">
          <iframe id="etfs-iframe"
                  title="Macro & Sector ETFs Google Sheet"
                  src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQUMru7EYeezAxCzyDbqbj5kwpcCI9nIVVqQb_UJY1nzkas55_rNOnps14ymD27awudy6qCFWEusI8h/pubhtml?widget=true&amp;headers=false"
                  loading="lazy"></iframe>
        </div>
      </section>

      <!-- SECTION 2: STOCKS IFRAME -->
      <section id="stocks-section" class="sheet-card">
        <div class="sheet-card-header">
          <div class="sheet-title-wrap">
            <span class="pulse-dot-emerald"></span>
            <h2 class="sheet-title">2. Stocks &amp; Market Leaders</h2>
            <span class="pill-emerald font-mono">Live Sheet</span>
          </div>
          <div>
            <button type="button" onclick="TerminalUI.reloadSingleFrame('stocks')" class="btn-secondary">
              Reload Stocks
            </button>
          </div>
        </div>

        <div id="stocks-frame-wrap" class="sheet-frame-wrap">
          <iframe id="stocks-iframe"
                  title="Stocks & Market Leaders Google Sheet"
                  src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTEu63iygiqETe_-jsNgE2KbG6krw6JT7gjP615q0u5wZDceE6A8YOkANajGjuHwYpPIuadMIAdOHNQ/pubhtml?widget=true&amp;headers=false"
                  loading="lazy"></iframe>
        </div>
      </section>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
